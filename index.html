<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Project</title>
    <link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- This is what appears on the browser tab -->
    <title>Student Academic Resources | Independent Study Hub</title>
    
    <!-- This is what web filters scan to categorize the site -->
    <meta name="description" content="A comprehensive directory of free online study tools, practice modules, and standardized test preparation materials. Developed to support secondary education students in mastering core curriculum standards, high school class preparation, and PSAT/PACT readiness through interactive cognitive reinforcement exercises.">
    
    <!-- Extra keywords that filters look for when grouping sites -->
    <meta name="keywords" content="study tools, secondary education, high school test prep, PSAT preparation, PACT review, interactive learning, academic resources, curriculum enrichment">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <h1>Interactive Canvas Demo</h1>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <p>Use Left and Right arrow keys to move the square.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
